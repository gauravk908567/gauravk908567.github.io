<!DOCTYPE html>
<!--[if gt IE 8]><!-->
<html class="no-js" lang="en">
<!--<![endif]-->
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-802G39EQ2E"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-802G39EQ2E');
    </script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Resume — Gaurav Kumar</title>
    <meta name="description" content="Resume of Gaurav Kumar, Game Producer.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/font-awesome.css">
    <link rel="stylesheet" href="css/templatemo-style.css?v=6">
    <style>
        /* Resume viewer — slate + cyan, Montserrat (inherits font from templatemo) */
        html, body { height: 100%; margin: 0; }
        body {
            background: #eef2f5;
            display: flex;
            flex-direction: column;
            font-family: 'Montserrat', sans-serif;
        }
        .resume-bar {
            background: #1f2933;
            color: #fff;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .resume-bar .who {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.3px;
        }
        .resume-bar .who span {
            display: block;
            font-weight: 400;
            font-size: 12px;
            color: #9fb6bb;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .resume-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .rbtn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 0;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.4px;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            transition: background 150ms ease, color 150ms ease;
        }
        .rbtn-primary { background: #0aa3c2; color: #fff; }
        .rbtn-primary:hover { background: #0890ac; color: #fff; }
        .rbtn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.35); }
        .rbtn-ghost:hover { background: rgba(255,255,255,0.12); }

        .viewer-wrap {
            flex: 1 1 auto;
            position: relative;
            background: #d7dde2;
        }
        #resume-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        /* Fallback shown if the PDF cannot be embedded */
        .resume-fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }
        .resume-fallback .card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            max-width: 460px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }
        .resume-fallback h3 { color: #1f2933; margin-top: 0; }
        .resume-fallback p { color: #3a3f47; }
        .resume-fallback i { font-size: 42px; color: #0aa3c2; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="resume-bar">
        <div class="who">
            Gaurav Kumar
            <span>Game Producer · Resume</span>
        </div>
        <div class="resume-actions">
            <a href="index.html" class="rbtn rbtn-ghost"><i class="fa fa-arrow-left"></i> Back to Portfolio</a>
            <button type="button" id="btn-fullscreen" class="rbtn rbtn-ghost"><i class="fa fa-expand"></i> Fullscreen</button>
            <button type="button" id="btn-download" class="rbtn rbtn-primary"><i class="fa fa-download"></i> Download PDF</button>
        </div>
    </div>

    <div class="viewer-wrap" id="viewer-wrap">
        <object id="resume-frame" data="doc/resume/GauravKumarResume.pdf#view=FitH&toolbar=1" type="application/pdf" width="100%" height="100%">
            <div class="resume-fallback" style="display:flex; position:static;">
                <div class="card">
                    <i class="fa fa-file-pdf-o"></i>
                    <h3>Open the resume</h3>
                    <p>Your browser cannot display the PDF inline. Use the button below to open it in a new tab.</p>
                    <a href="doc/resume/GauravKumarResume.pdf" class="rbtn rbtn-primary" target="_blank" rel="noopener"><i class="fa fa-external-link"></i> Open Resume in New Tab</a>
                </div>
            </div>
        </object>
        <div class="resume-fallback" id="resume-fallback">
            <div class="card">
                <i class="fa fa-file-pdf-o"></i>
                <h3>Open the resume</h3>
                <p>Your browser could not display the PDF inline. Use the button below to open it.</p>
                <a href="doc/resume/GauravKumarResume.pdf" class="rbtn rbtn-primary" target="_blank" rel="noopener"><i class="fa fa-external-link"></i> Open Resume PDF</a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            function track(name, params) {
                if (typeof window.gtag === 'function') window.gtag('event', name, params || {});
            }

            // Resume opened
            track('resume_view', { page: 'resume.html' });

            // Time spent on the resume page (engagement signal)
            var start = Date.now();
            window.addEventListener('beforeunload', function () {
                var secs = Math.round((Date.now() - start) / 1000);
                track('resume_time', { seconds: secs });
            });

            // Download — only when the user clicks the button (no auto-download).
            var PDF = 'doc/resume/GauravKumarResume.pdf';
            var dl = document.getElementById('btn-download');
            if (dl) dl.addEventListener('click', function () {
                track('resume_download', { file: PDF });
                var a = document.createElement('a');
                a.href = PDF;
                a.download = 'GauravKumarResume.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });

            // Fullscreen toggle on the viewer
            var fs = document.getElementById('btn-fullscreen');
            var wrap = document.getElementById('viewer-wrap');
            if (fs && wrap) fs.addEventListener('click', function () {
                if (!document.fullscreenElement) {
                    (wrap.requestFullscreen || wrap.webkitRequestFullscreen || function(){}).call(wrap);
                    track('resume_fullscreen');
                } else {
                    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
                }
            });

            // If the PDF 404s (not uploaded yet), show the outer fallback card.
            // (The <object> shows its own inner fallback if it simply can't render.)
            var frame = document.getElementById('resume-frame');
            var fallback = document.getElementById('resume-fallback');
            fetch(PDF, { method: 'HEAD' })
                .then(function (r) {
                    if (!r.ok) throw new Error('missing');
                })
                .catch(function () {
                    if (frame) frame.style.display = 'none';
                    if (fallback) fallback.style.display = 'flex';
                });
        })();
    </script>
</body>
</html>
